name: respyr_dietitian
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  timezone: ^0.10.0

  # Core
  cupertino_icons: ^1.0.8
  get: 4.6.6
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.2
  http_parser: ^4.0.2
  connectivity_plus: ^6.1.5
  internet_connection_checker_plus: ^2.5.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # UI / Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.3.0
  dotted_border: ^2.1.0
  loading_animation_widget: ^1.3.0
  flutter_inner_shadow: 0.0.1
  flutter_inset_box_shadow: ^1.0.8
  simple_horizontal_calendar: ^0.0.2
  sliding_action_button: ^0.0.7
  dash_chat_2: ^0.0.21
  syncfusion_flutter_gauges: ^30.2.5
  fl_chart: 0.69.0
  flutter_local_notifications: ^19.4.0
  app_settings: ^5.1.1





  # Media / Files
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  crop_your_image: ^2.0.0
  flutter_image_compress: ^2.4.0
  file_picker: ^10.2.0
  video_player: ^2.10.1
  flutter_cache_manager: ^3.4.1
  audioplayers: ^6.5.1

  # Device / Platform
  device_info_plus: ^10.1.0
  permission_handler: ^12.0.1
  android_intent_plus: ^6.0.0
  wakelock_plus: ^1.2.5
  cupertino_battery_indicator: ^1.2.1
  flutter_blue_plus: ^1.32.4
  webview_flutter: ^4.7.0

  # Utilities
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  country_code_picker: ^3.3.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  fluttertoast: ^8.2.8
  jwt_decoder: ^2.0.1
  init: ^1.0.0
  pinput: ^5.0.1
  in_app_update: ^4.2.5
  new_version_plus: ^1.0.1

  sqflite: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1


dependency_overrides:
  web: 0.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/common/
    - assets/images/device_connection/
    - assets/images/result_screen/
    - assets/images/icons/
    - assets/images/result_history/
    - assets/images/gif_images/
    - assets/images/walk_through/
